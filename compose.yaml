services:
    api:
        build: .
        ports: ["3000:3000"]
        environment:
            DATABASE_URL: postgres://postgres:dev@db:5432/tasks
        depends_on:
            db:
                condition: service_healthy
        
    db:
        image: postgres:16
        ports: ["5432:5432"]
        environment:
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: tasks
        volumes: [taskdata:/var/lib/postgresql/data]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 2s
            timeout: 5s
            retries: 10

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        environment:
        - REDIS_ARGS=--requirepass redispass --appendonlyes
        restart: unless-stopped 


volumes:
    taskdata:
    redis-data:
        driver: local